context_weight: 440
confidence: 1.0
conflicts_with: []
requires: []
constraints:
- Every Python function that executes a database query (SELECT, INSERT, UPDATE, DELETE
  — via SQLAlchemy, raw SQL, or any ORM) must have an explicit return type annotation.
- 'Use specific types: list[MyModel], MyModel | None, int, etc. Never bare Any unless
  the result genuinely cannot be narrowed.'
- Applies to all query-handling functions regardless of whether they are public or
  private.
anti_patterns:
- Do not write a DB query function without a return type annotation.
- Do not use bare Any as a return type for query results unless the shape is genuinely
  unknowable at the call site.
- Do not rely on implicit return type inference for query functions — the annotation
  must be explicit.
doc_anchors:
- url: https://mypy.readthedocs.io/en/stable/cheat_sheet_py3.html
  verified: '2026-05-08'
archived: false
rationale: Explicit return types on query functions make contracts clear to callers,
  catch shape mismatches at type-check time (mypy/pyright), and prevent silent None
  or wrong-type returns propagating through the call stack. Missing annotations on
  query functions are a common source of hard-to-debug runtime errors.
