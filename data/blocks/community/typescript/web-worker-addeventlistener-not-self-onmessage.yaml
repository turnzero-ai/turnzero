constraints:
- 'In TypeScript Web Worker files, use `addEventListener(''message'', async (event:
  MessageEvent<T>) => { ... })` instead of `self.onmessage = ...`.'
- 'Type the event parameter explicitly: `MessageEvent<{ file: File }>` or whatever
  the payload type is.'
anti_patterns:
- Do not use `self.onmessage = (event) => { ... }` in TypeScript worker files — causes
  type conflicts between DOM's Window.onmessage and WorkerGlobalScope.onmessage, producing
  TS errors.
- Do not rely on implicit `self` typing in worker files without a tsconfig `lib` override.
rationale: TypeScript's default lib includes both DOM and Worker types. `self.onmessage`
  is ambiguous — tsc sees it as Window.onmessage and raises type errors. `addEventListener`
  is unambiguous and resolves correctly in the Worker context at runtime.
