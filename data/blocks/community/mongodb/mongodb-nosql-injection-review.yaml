rationale: MongoDB treats dollar-prefixed keys as operators in query contexts and
  documents with dollar-prefixed or dotted field names have important indexing,
  shard-key, JSON Schema validation, and encryption restrictions. Building filters
  from allowlisted scalar fields and enforcing collection schema validation prevents
  attacker-controlled request objects from changing query semantics or persisting
  malformed documents.
