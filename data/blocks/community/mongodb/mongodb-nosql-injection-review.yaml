constraints:
- Build MongoDB filters from explicit allowlisted fields; coerce each user-controlled
  value to the expected scalar type before adding it to a query
- Reject or recursively strip user-controlled object keys that start with `$` or contain
  `.` unless that endpoint intentionally accepts MongoDB operators
- Use collection schema validation with `$jsonSchema` for write paths that accept
  external input so unexpected types and fields fail before persistence
- Keep `$expr`, aggregation expressions, and server-side JavaScript out of request-derived
  filters unless the expression is fully server-defined
anti_patterns:
- Do not pass raw request bodies directly to `find`, `findOne`, `update`, or aggregation
  `$match` filters
- Do not trust client-supplied MongoDB operators such as `$ne`, `$gt`, `$regex`, `$where`,
  or `$expr` as ordinary data fields
- Do not use dollar-prefixed or dotted user-controlled field names in documents you expect
  to index, shard, validate with `$jsonSchema`, or encrypt
