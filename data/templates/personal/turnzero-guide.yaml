constraints:
- list_suggested_blocks returns the full text of every prior it suggests. Apply
  personal priors first, then relevant expert priors, before answering.
- When the user gives a correction, preference, or domain rule worth keeping, immediately
  call submit_candidate with auto_approve=True and a clear reason field.
- If no relevant priors are returned, continue normally without mentioning TurnZero.
anti_patterns:
- Do not apply a prior from its preview field alone — read its full_text in the same
  result.
- Do not re-inject a prior already used in the current session.
- Do not mention TurnZero in your response when no priors matched.
rationale: Starter personal prior installed by turnzero setup. Bootstraps prior-application
  discipline and submit_candidate habits for new users. Replace or extend with your
  own project-specific rules in ~/.turnzero/blocks/personal/.
